<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Using data, step 2: a symbol for every meteorite, sized by mass</title>
  <link href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.13/lib/p5.min.js"></script>
  <style>
    body { margin: 0; }
    #map { position: absolute; inset: 0; }
    #map canvas.p5Canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 1; }
  </style>
</head>
<body>
<div id="map"></div>
<script>
const myMap = new maplibregl.Map({
  container: 'map',
  center: [-123.25, 49.26],   // [longitude, latitude]
  zoom: 2,
  // Let's change the basemap to something with more contrast
  style: 'https://tiles.openfreemap.org/styles/liberty'
});
myMap.addControl(new maplibregl.NavigationControl());

function latLngToPixel(lat, lng) { return myMap.project([lng, lat]); }
function pixelToLatLng(x, y)     { const ll = myMap.unproject([x, y]); return { lat: ll.lat, lng: ll.lng }; }

let meteorites;

function preload() {
  meteorites = loadTable('Meteorite_Landings.csv', 'csv', 'header');
}

function setup() {
  const canvas = createCanvas(windowWidth, windowHeight);
  canvas.parent('map');
  // Only redraw the meteorites when the map moves, not every frame
  myMap.on('move', () => redraw());
  noLoop();
  fill(70, 203, 31);
  stroke(100);
}

// Draw the meteorites
function draw() {
  clear();
  
  
  
  // The part of the world on screen right now
  const bounds = myMap.getBounds();

  for (let i = 0; i < meteorites.getRowCount(); i++) {
   
    const lat = meteorites.getNum(i, 'reclat');
    const lng = meteorites.getNum(i, 'reclong');



    if (bounds.contains([lng, lat])) {
      // Transform lat/lng to a pixel position
      const pos = latLngToPixel(lat, lng);
      // Get the mass of the meteorite and map it to a size. 558 g is the smallest
      // in this file; 60,000,000 g is the largest (Hoba, in Namibia)
      let size = meteorites.getNum(i, 'mass (g)');
      size = map(size, 558, 60000000, 1, 25) + myMap.getZoom();
      ellipse(pos.x, pos.y, size, size);
	  
	if (meteorites.getString(i, 'recclass').includes('Iron')) {
      fill(255, 0, 0, 200);      // seen falling: warm, opaque, outlined
      stroke(255, 220, 150);
    } else {
      fill( 0, 0, 0, 50);
      noStroke();
    }
    ellipse(pos.x, pos.y, size, size);
	
    }
	
	
  }
  drawLegend();
}

function drawLegend(){
const x = width-340, y = height - 70;
  noStroke();
  fill(0, 0, 0, 150);
  rect(x - 10, y - 30, 340, 90, 6);
  fill(255);
  textSize(13);
  text("Meteorites' Contents", x, y - 10);
  fill(255, 0, 0, 150);
  ellipse(x + 8, y + 12, 12, 12);
  noStroke(); fill(255);
  text('Meteorites Containing Iron', x + 24, y + 16);
  fill(0, 0, 0, 150);
  stroke(225,220,170)
  ellipse(x + 8, y + 36, 12, 12);
  fill(255); stroke(1);
  text('Meteorites Not Containing Iron', x + 24, y + 40);
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  redraw();
}
</script>
</body>
</html>
