<body>

<p> 

	Buffer Distance (km):
	<input id="distanceInput" type="number" value="10" min ="0.1">

  <div id="map"></div>
  
  <div id="legend">

<div id="title">
  Vancouver Island Bird Sightings
  </div>

    <p><span class = "EW"></span> Eurasian Wigeon</p>
	<p><span class = "RD"></span> Ruddy Duck</p>
	<p><span class = "YBL"></span> Yellow-billed Loon</p>
	
	<!--<small>
	Data sourced from iNaturalist
	</small>
	-->
  </div>
  <script>
    const map = new maplibregl.Map({
      container: 'map',
      style: 'bird_watching.json',        // the file you downloaded from Maputnik
      center: [-125.448, 49.56],    // longitude, latitude
      zoom: 7,
	  attributionControl:{
		customAttribution: 'Observations from iNaturalist'
	  }
     });	 
	 
	//function writing area is here 
/*	
function onMapClicked(e) {

map.on('load', async function(){

const response = await fetch('birds.geojson');
const birds = await response.json();

map.addSource('point', {
	type: 'geojson',
	data: {
		type: 'FeatureCollection',
		features: []
}
});

map.addSource('buffered', {
	type: 'geojson',
	data: {
		type: 'FeatureCollection',
		features: []
	}
});



map.addLayer({
	id: 'buffered-fill',
	type: 'fill',
	source: 'buffered',
	paint: {
		'fill-color': '#2166ac',
		'fill-opacity': 0.2
	}
});

map.addLayer({
	id: 'point-circle',
	type: 'circle',
	source: 'point',
	paint: {
		'circle-radius': 5,
		'circle-color': '#545351'
	}
});

//map.on('click', onMapClicked);
map.on('click', function(e) {
	//alert('Mapclicked!');
	 const clicked = turf.point([e.lngLat.lng, e.lngLat.lat]);
	 
          const distanceEntry = document.getElementById('distanceInput');
          const distance = Number(distanceEntry.value);
          if (distance <= 0) {
            alert('Please use a Distance Above 0');
            return;
          }
          const clickedBuffer = turf.buffer(clicked, distance, { units: 'kilometers' 
});

	map.getSource('buffered').setData(clickedBuffer);
		map.getSource('point').setData(clicked);

	const within = turf.pointsWithinPolygon(birds, clickedBuffer);
	//alert('Birds within buffer calculated');
	const totalWithin = within.features.length;
	let wigeonCount=0;
	let duckCount = 0;
	let loonCount = 0;

for (let i=0; i<within.features.length; i=i+1) {
const bird=within.features[i];
//alert(bird.properties.common_name == 'Eurasian Wigeon');
	if (bird.properties.common_name=='Eurasian Wigeon'){
	wigeonCount=wigeonCount+1;
	} else if (bird.properties.common_name=='Ruddy Duck'){
	duckCount=duckCount+1
	} else if (bird.properties.common_name=='Yellow-billed Loon'){
	loonCount=loonCount+1
	}



}

if(within.features.length ==0){
return;
}
//alert('Counting complete: ' + wigeonCount + ', ' + duckCount + ', ' + loonCount);
	const wigeonTotal=328;
	const duckTotal=56;
	const loonTotal=34;

	const wigeonPercent=(wigeonCount/wigeonTotal*100).toFixed(1);
	const duckPercent=(duckCount/duckTotal*100).toFixed(1);
	const loonPercent=(loonCount/loonTotal*100).toFixed(1);
	
const popupText=
	'<strong>Percent of Sightings in Area</strong><br>' +
	'Eurasian Wigeon: ' + wigeonCount + ' ('+wigeonPercent +'%)<br>' +
	'Ruddy Duck: ' + duckCount + ' ('+duckPercent +'%)<br>' +
	'Yellow-billed Loon: ' + loonCount + ' ('+loonPercent +'%)' ;
	
const popup = new maplibregl.Popup();
	popup.setLngLat(e.lngLat)
	popup.setHTML(popupText)
	popup.addTo(map);





//alert(popupText);

	
	
	
		


});
