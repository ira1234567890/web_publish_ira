<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>My map</title>
  <link href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <style>
    body { margin: 0; }
    #map { position: absolute; inset: 0; }
    #legend { position: absolute; left: 10px; bottom: 30px;
              width: 220px; padding: 8px; background: white; }
			  
			  
    //#bar { height: 14px; background: linear-gradient(to right,
  //         rgba(253,174,107,0), #fdae6b 8%, #7f2704); }
  
  
    #legend p { font-size: 14px; margin: 5px 0 0; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="legend">Public Amenities 
   <!--   <div id="bar"></div> 0 <span style="float: right">5,000 or more</span>-->
    <p>Bikeways</p>
	<p>Washrooms</p>
    <p>Drinking Fountains</p>
  </div>
  <script>
    const map = new maplibregl.Map({
      container: 'map',
      style: 'style.json',        // the file you downloaded from Maputnik
      center: [-123.137, 49.25],    // longitude, latitude
      zoom: 11.3
     });
    map.addControl(new maplibregl.NavigationControl());

function onEachFountain (e){
	const fountain=e.features[0].properties;
	if(fountain.IN_OPERATIO){
		const popup=new maplibregl.Popup();
		popup.setLngLat(e.lngLat);
		popup.setText("Drinking Fountain In Operation " +fountain.IN_OPERATIO);
		popup.addTo(map);
	
	} else {
	const popup3=new maplibregl.Popup();
		popup3.setLngLat(e.lngLat);
		popup3.setText("Hours unavailable");
		popup3.addTo(map);
	}

}


function onEachWashroom (e){
	const washroom=e.features[0].properties;
	if(washroom.Summer_hour){
		const popup1=new maplibregl.Popup();
		popup1.setLngLat(e.lngLat);
		popup1.setText("Washroom In Operation (Summer): " +washroom.Summer_hour);
		popup1.addTo(map);

	} else{
	const popup2=new maplibregl.Popup();
		popup2.setLngLat(e.lngLat);
		popup2.setText("Hours unavailable");
		popup2.addTo(map);
	
	}

}


function drawLegend(){
	

}

drawLegend()

map.on('click', 'fountains-copy', onEachFountain)
map.on('click', 'washrooms-copy', onEachWashroom)
  </script>
</body>
</html>
